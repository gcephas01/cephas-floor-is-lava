<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a2c"><title>The Floor Is Lava — Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b1221;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}#app{width:100vw;height:100dvh;display:flex;flex-direction:column;background:#101b2d;user-select:none;-webkit-user-select:none}header{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#101a2b;border-bottom:2px solid #2a3a4c;gap:10px}header strong{font-size:clamp(14px,2.2vw,22px);letter-spacing:.07em}#hud{display:flex;gap:clamp(8px,2vw,24px);align-items:center;font-weight:900;font-size:clamp(12px,1.8vw,18px)}#hud span{white-space:nowrap}#pause{border:1px solid #64748b;background:#253349;color:white;border-radius:9px;font-size:18px;font-weight:900;padding:5px 12px;cursor:pointer;min-width:44px;min-height:36px}#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#1b2e45}canvas{width:100%;height:100%;display:block;touch-action:none}#controls{height:clamp(92px,18vh,150px);flex:none;display:flex;justify-content:center;align-items:center;padding:10px 12px;gap:12px;background:#101a2b;border-top:2px solid #34465b}#dpad{display:flex;gap:10px;align-items:center}#controls .control{flex-shrink:0}button{touch-action:none;-webkit-tap-highlight-color:transparent} .control{width:clamp(70px,12vw,112px);height:clamp(65px,12vh,104px);border:3px solid #8ba2bc;border-radius:19px;background:#2a415e;color:white;font-size:clamp(25px,4vw,42px);font-weight:900;box-shadow:inset 0 -6px #152438;cursor:pointer}.control:active,.control.pressed{transform:translateY(3px);box-shadow:inset 0 -2px #152438;background:#3f6389}#jump{width:clamp(105px,16vw,155px);margin-left:8px;background:#ffba32;border-color:#ffe29b;color:#40240b;box-shadow:inset 0 -7px #c36c19;font-size:clamp(19px,3vw,29px)}#jump:active,#jump.pressed{background:#ffd46e}#overlay{position:absolute;inset:0;background:rgba(8,14,27,.68);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}#overlay.hidden{display:none}.panel{text-align:center;background:linear-gradient(160deg,#22364e,#14243a);border:3px solid #ffb53a;border-radius:24px;padding:clamp(20px,4vw,38px);max-width:520px;width:100%;box-shadow:0 18px 80px #0008}.panel h1{margin:0 0 8px;font-size:clamp(30px,6vw,53px);line-height:1.02;color:#ffca57;text-shadow:0 3px #9a3a1b}.panel p{font-size:clamp(15px,2.3vw,21px);line-height:1.35;margin:12px 0 20px}.panel button{border:0;border-radius:15px;background:#ffbb36;color:#39230d;font-size:clamp(21px,3vw,28px);font-weight:1000;padding:16px 35px;min-height:60px;cursor:pointer}.small{font-size:13px!important;color:#c4d4e5;margin-top:14px!important}.tip{position:absolute;top:14px;left:50%;transform:translateX(-50%);border-radius:12px;padding:9px 15px;background:#0b1429c9;font-weight:900;pointer-events:none;text-align:center;white-space:nowrap;opacity:0;transition:opacity .2s;max-width:90%;overflow:hidden;text-overflow:ellipsis}#tip.visible{opacity:1}@media(max-width:560px){header{height:43px;padding:0 8px}header strong{letter-spacing:0}#hud{gap:8px}#controls{padding:8px 10px;gap:8px}#dpad{gap:8px}#jump{margin-left:2px}.control{width:67px;height:70px}#jump{width:112px;height:70px}}@media(max-height:420px){header{height:35px}#controls{height:74px}.control{height:55px}#jump{height:55px}}
</style></head><body><div id="app"><header><strong>🌋 THE FLOOR IS LAVA</strong><div id="hud"><span id="stars">⭐ 0</span><span id="lives">❤️ 3</span><span id="progress">🏁 0%</span><button id="pause" aria-label="Pause game">Ⅱ</button></div></header><main id="stage"><canvas id="game" aria-label="Side-scrolling lava platform game"></canvas><div id="tip" class="tip" aria-live="polite"></div><div id="overlay"><div class="panel"><h1 id="overlayTitle">THE FLOOR<br>IS LAVA!</h1><p id="overlayText">RUN • JUMP • ESCAPE!<br>Collect stars and reach the flag.</p><button id="start">▶ PLAY!</button><p class="small">Hold ◀ ▶ to run. Tap or hold JUMP to leap.<br>Keyboard: arrows / A D and Space.</p></div></div></main><footer id="controls"><div id="dpad"><button class="control" id="left" aria-label="Move left">◀</button><button class="control" id="right" aria-label="Move right">▶</button></div><button class="control" id="jump" aria-label="Jump">JUMP ↥</button></footer></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');const overlay=document.getElementById('overlay'),title=document.getElementById('overlayTitle'),description=document.getElementById('overlayText'),start=document.getElementById('start'),pause=document.getElementById('pause'),tip=document.getElementById('tip');const starHud=document.getElementById('stars'),lifeHud=document.getElementById('lives'),progressHud=document.getElementById('progress');let W=900,H=450,scale=1,worldW=4300,ground=370,cam=0,elapsed=0,playing=false,paused=false,dead=false,won=false,last=0,raf=0,tipTimer=0,invuln=0,checkpoint=0,stars=0,lives=3,particles=[];const input={left:false,right:false,jump:false,jumpPressed:false};let platforms=[],coins=[],springs=[],player={x:48,y:0,w:29,h:42,vx:0,vy:0,onGround:false,coyote:0,jumpBuffer:0,face:1};const layouts=[ [0,240,0],[290,155,-40],[500,145,-78],[710,140,-20],[910,165,-80],[1150,135,-30],[1345,150,-95],[1560,145,-48],[1770,170,-80],[2010,145,-35],[2210,160,-92],[2440,140,-48],[2650,145,-10],[2855,155,-78],[3075,150,-32],[3290,165,-92],[3525,150,-40],[3735,145,-85],[3940,330,-15] ];
function resize(){const r=stage.getBoundingClientRect();W=Math.max(320,r.width);H=Math.max(180,r.height);const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ground=Math.max(150,H-85);platforms.forEach((p,i)=>p.y=ground+layouts[i][2]);if(!playing&&player.y===0)player.y=ground-player.h;}
function resetWorld(){platforms=layouts.map((a,i)=>({x:a[0],w:a[1],y:ground+a[2],h:22,type:i===5||i===12?'crack':i===8||i===15?'spring':'stone',crack:0,broken:false}));coins=[];platforms.forEach((p,i)=>{if(i>0&&i<18){coins.push({x:p.x+p.w/2,y:p.y-46,taken:false});if(i%3===0)coins.push({x:p.x+p.w/2+28,y:p.y-75,taken:false});}});player={x:54,y:platforms[0].y-42,w:29,h:42,vx:0,vy:0,onGround:false,coyote:0,jumpBuffer:0,face:1};cam=0;elapsed=0;checkpoint=0;stars=0;lives=3;invuln=0;particles=[];dead=false;won=false;updateHud();}
function updateHud(){starHud.textContent='⭐ '+stars;lifeHud.textContent='❤️ '+lives;progressHud.textContent='🏁 '+Math.min(100,Math.floor(player.x/(worldW-130)*100))+'%';}
function showTip(message){tip.textContent=message;tip.classList.add('visible');tipTimer=2.1;}
function showOverlay(head,body,button){title.innerHTML=head;description.innerHTML=body;start.textContent=button;overlay.classList.remove('hidden');playing=false;paused=false;pause.textContent='Ⅱ';}
function hideOverlay(){overlay.classList.add('hidden');playing=true;paused=false;pause.textContent='Ⅱ';last=performance.now();}
function respawn(){if(lives<=0){showOverlay('LAVA GOT YOU!','You collected ⭐ '+stars+' stars.<br>Ready to try again?','↻ TRY AGAIN');return;}player.x=checkpoint||54;const p=platforms.filter(p=>!p.broken&&p.x<=player.x+10&&p.x+p.w>=player.x).sort((a,b)=>a.y-b.y)[0]||platforms[0];player.y=p.y-player.h-4;player.vx=0;player.vy=0;invuln=1.8;showTip('SPLASH! ❤️ '+lives+' left');}
function splash(){if(invuln>0||!playing)return;lives--;for(let i=0;i<18;i++)particles.push({x:player.x+15,y:Math.max(player.y,ground+40),vx:(Math.random()-.5)*220,vy:-Math.random()*180,life:.8,size:3+Math.random()*7});updateHud();respawn();}
function update(dt){if(!playing||paused)return;elapsed+=dt;invuln=Math.max(0,invuln-dt);if(tipTimer>0){tipTimer-=dt;if(tipTimer<=0)tip.classList.remove('visible');}player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);player.coyote=Math.max(0,player.coyote-dt);const dir=(input.right?1:0)-(input.left?1:0);const speed=245;player.vx+=(dir*speed-player.vx)*Math.min(1,dt*(dir?14:18));if(dir)player.face=dir;const oldBottom=player.y+player.h;player.vy+=1120*dt;player.vy=Math.min(850,player.vy);if(player.jumpBuffer>0&&(player.onGround||player.coyote>0)){player.vy=-470;player.onGround=false;player.coyote=0;player.jumpBuffer=0;}if(!input.jump&&player.vy< -170)player.vy+=1350*dt;player.x=Math.max(0,Math.min(worldW-player.w,player.x+player.vx*dt));player.y+=player.vy*dt;let landed=false;for(const p of platforms){if(p.broken)continue;if(player.vy>=0&&oldBottom<=p.y+10&&player.y+player.h>=p.y&&player.x+player.w>p.x+5&&player.x<p.x+p.w-5){player.y=p.y-player.h;player.vy=0;landed=true;if(p.type==='spring'){player.vy=-650;showTip('SUPER BOUNCE! 🚀');}if(p.type==='crack'){p.crack+=dt;if(p.crack>.9){p.broken=true;showTip('ROCK BROKE!');}}}}if(landed){player.coyote=.11;}else if(player.onGround){player.coyote=.11;}player.onGround=landed;for(const c of coins){if(!c.taken&&Math.abs(player.x+player.w/2-c.x)<29&&Math.abs(player.y+player.h/2-c.y)<38){c.taken=true;stars++;updateHud();}}if(player.x>1100&&checkpoint<1130){checkpoint=1190;showTip('CHECKPOINT! 🚩');}if(player.x>2650&&checkpoint<2660){checkpoint=2690;showTip('CHECKPOINT! 🚩');}if(player.x>4180){won=true;updateHud();showOverlay('YOU ESCAPED! 🏆','AMAZING RUN!<br>⭐ '+stars+' stars collected.','▶ PLAY AGAIN');}const lavaY=ground+43+Math.sin(elapsed*1.8)*5;const surge=(Math.sin(elapsed*.38)>0.86)?(Math.sin(elapsed*.38)-.86)*185:0;if(player.y+player.h>lavaY-surge+12||player.y>H+120)splash();for(const p of platforms){if(p.type==='crack'&&p.crack>0&&!p.broken){p.crack+=dt*.2;if(p.crack>1.15)p.broken=true;}}for(const part of particles){part.x+=part.vx*dt;part.y+=part.vy*dt;part.vy+=350*dt;part.life-=dt;}particles=particles.filter(p=>p.life>0);const target=Math.max(0,Math.min(worldW-W,player.x-W*.32));cam+=(target-cam)*Math.min(1,dt*5);updateHud();}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#17243f');sky.addColorStop(1,'#53364a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam*.18,0);for(let i=0;i<17;i++){const x=i*320-100;ctx.fillStyle=i%2?'#2a3048':'#30364c';ctx.beginPath();ctx.moveTo(x,ground+55);ctx.lineTo(x+130,ground-110-(i%3)*30);ctx.lineTo(x+280,ground+55);ctx.fill();}ctx.restore();ctx.save();ctx.translate(-cam,0);for(const p of platforms){if(p.broken)continue;ctx.fillStyle='#111927';ctx.fillRect(p.x+3,p.y+7,p.w,p.h);ctx.fillStyle=p.type==='spring'?'#64e2aa':p.type==='crack'?'#bca7a0':'#9ca7b6';ctx.fillRect(p.x,p.y,p.w,11);ctx.fillStyle='#596579';ctx.fillRect(p.x+5,p.y+11,p.w-10,10);if(p.type==='spring'){ctx.fillStyle='#f5e67b';ctx.fillRect(p.x+8,p.y-6,p.w-16,6);}if(p.type==='crack'){ctx.strokeStyle='#352a37';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x+p.w*.3,p.y);ctx.lineTo(p.x+p.w*.42,p.y+10);ctx.lineTo(p.x+p.w*.38,p.y+20);ctx.stroke();}}for(const c of coins){if(c.taken)continue;ctx.fillStyle='#ffda51';ctx.beginPath();for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,r=j%2?7:14;ctx.lineTo(c.x+Math.cos(a)*r,c.y+Math.sin(a)*r);}ctx.closePath();ctx.fill();}ctx.fillStyle='#c6d7e7';ctx.fillRect(4215,ground-130,5,130);ctx.fillStyle='#ffbd38';ctx.beginPath();ctx.moveTo(4220,ground-130);ctx.lineTo(4270,ground-108);ctx.lineTo(4220,ground-88);ctx.fill();if(invuln<=0||Math.floor(invuln*10)%2===0){const x=player.x,y=player.y;ctx.fillStyle='#151a31';ctx.fillRect(x+4,y+37,9,5);ctx.fillRect(x+18,y+37,9,5);ctx.fillStyle='#3cb8e8';ctx.fillRect(x+4,y+18,22,21);ctx.fillStyle='#f1bd8c';ctx.fillRect(x+6,y+2,18,19);ctx.fillStyle='#392c3c';ctx.fillRect(x+5,y,20,6);ctx.fillStyle='#182339';ctx.fillRect(x+(player.face>0?19:9),y+10,3,3);ctx.fillStyle='#ffca4a';ctx.fillRect(x+2,y+20,5,12);}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#ff9c31';ctx.fillRect(p.x,p.y,p.size,p.size);}ctx.globalAlpha=1;ctx.restore();const lavaY=ground+43+Math.sin(elapsed*1.8)*5;const surge=(Math.sin(elapsed*.38)>0.86)?(Math.sin(elapsed*.38)-.86)*185:0;const y=lavaY-surge;const lava=ctx.createLinearGradient(0,y,0,H);lava.addColorStop(0,'#ffdc4a');lava.addColorStop(.22,'#ff8027');lava.addColorStop(1,'#b72a22');ctx.fillStyle=lava;ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,y);for(let x=0;x<=W+15;x+=15)ctx.lineTo(x,y+Math.sin(x*.032+elapsed*3)*5);ctx.lineTo(W,H);ctx.fill();ctx.fillStyle='#ffd97b';for(let i=0;i<16;i++){const x=(i*127+elapsed*19)%W,by=y+25+(i%3)*24;if(by<H){ctx.beginPath();ctx.ellipse(x,by,10+i%3*4,3,0,0,Math.PI*2);ctx.fill();}}if(surge>6){ctx.fillStyle='#ffdc6d';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('⚠ LAVA SURGE!',W/2,36);}if(paused){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 44px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2);}}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();raf=requestAnimationFrame(loop);}function setControl(name,value){input[name]=value;if(name==='jump'&&value)input.jumpBuffer=.14;const el=document.getElementById(name);if(el)el.classList.toggle('pressed',value);}for(const name of ['left','right','jump']){const el=document.getElementById(name);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);setControl(name,true);});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,e=>{e.preventDefault();setControl(name,false);});}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();if(e.repeat)return;if(['ArrowLeft','KeyA'].includes(e.code))setControl('left',true);if(['ArrowRight','KeyD'].includes(e.code))setControl('right',true);if(['ArrowUp','Space','KeyW'].includes(e.code))setControl('jump',true);});window.addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))setControl('left',false);if(['ArrowRight','KeyD'].includes(e.code))setControl('right',false);if(['ArrowUp','Space','KeyW'].includes(e.code))setControl('jump',false);});window.addEventListener('blur',()=>{for(const k of ['left','right','jump'])setControl(k,false);if(playing)paused=true;});start.addEventListener('click',()=>{if(dead||won||lives<=0)resetWorld();if(!playing&&elapsed===0)resetWorld();hideOverlay();});pause.addEventListener('click',()=>{if(!playing)return;paused=!paused;pause.textContent=paused?'▶':'Ⅱ';});new ResizeObserver(()=>resize()).observe(stage);resize();resetWorld();last=performance.now();raf=requestAnimationFrame(loop);})();
</script></body></html>
